[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bart-spine-ui"
version = "0.1.0"
description = "Standalone BART Spine medical imaging and surgical workflow UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7,<7",
    "vtk>=9.3,<10",
    "SimpleITK>=2.3,<3",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
bart-spine-ui = "bart_spine_ui.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bart_spine_ui.assets.model.src.bart_spine_implant_models" = [
    "assets/manifest.json", "assets/screws/*.stl", "assets/tulip/*.stl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
